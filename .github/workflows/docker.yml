name: Docker

on:
  workflow_call:
    outputs:
      image:
        description: Published image reference pinned to its digest
        value: ${{ jobs.build.outputs.image }}
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

jobs:
  build:
    name: Build image

    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/chalmers.it@${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/chalmers.it
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=edge
            type=ref,event=pr

      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    permissions:
      contents: read
      packages: write
