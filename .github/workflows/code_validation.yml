name: Code validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WORKFLOW_NODE_VERSION: 20.x

jobs:
  test:
    name: Unit tests

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.WORKFLOW_NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.WORKFLOW_NODE_VERSION }}

      - name: pnpm install
        run: npm install -g pnpm@9.15.9

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  run-linters:
    name: Execute linters
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.WORKFLOW_NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.WORKFLOW_NODE_VERSION }}

      - name: pnpm install
        run: npm install -g pnpm@9.15.9

      - run: pnpm install prettier

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          filter_mode: ${{ (github.event_name == 'pull_request') && 'file' || 'nofilter' }}
          level: ${{ (github.event_name == 'pull_request') && 'error' || 'warning' }}
          tool_name: ESLint

      - name: Prettier
        uses: EPMatt/reviewdog-action-prettier@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          filter_mode: ${{ (github.event_name == 'pull_request') && 'file' || 'nofilter' }}
          level: ${{ (github.event_name == 'pull_request') && 'error' || 'warning' }}
          tool_name: Prettier

  gamma-integration:
    name: Gamma integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.WORKFLOW_NODE_VERSION }}
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gamma-browser-traces
          path: test-results/
          retention-days: 7
