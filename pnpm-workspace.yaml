overrides:
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  esbuild: true
  unrs-resolver: true
  # Optional native optimizations are unnecessary for the local Docker connection.
  cpu-features: false
  ssh2: false
  # protobufjs only prints a version-scheme warning in its postinstall hook.
  protobufjs: false
# Keep the explicitly selected Playwright release installable during its release-age window.
minimumReleaseAgeExclude:
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0
