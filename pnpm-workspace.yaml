overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  esbuild: true
  unrs-resolver: true
  # Optional native optimizations are unnecessary for the local Docker connection.
  cpu-features: false
  ssh2: false
  # protobufjs only prints a version-scheme warning in its postinstall hook.
  protobufjs: false
