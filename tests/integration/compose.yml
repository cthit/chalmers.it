services:
  gamma:
    # Gamma 2.5.1, verified against the registry digest.
    image: ghcr.io/cthit/gamma:2.5.1@sha256:5112c5673ee5c98b072c38afe4ed0de5f7f7d6ae85c41bbd318c92f0e3d5d9db
    platform: linux/amd64
    environment:
      DB_HOST: db
      DB_NAME: gamma_test
      DB_USER: gamma_test
      DB_PASSWORD: gamma_test
      REDIS_HOST: redis
      SERVER_PORT: '8081'
      BASE_URL: http://localhost:8081
      PRODUCTION: 'false'
      IS_MOCKING: 'true'
      ADMIN_SETUP: 'true'
      MOCK_DATA_RESOURCE: file:/tmp/gamma-seed.json
      UPLOAD_FOLDER: /tmp/uploads/
    volumes:
      - ./gamma-seed.json:/tmp/gamma-seed.json:ro
    ports:
      - '127.0.0.1::8081'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16.0-alpine
    environment:
      POSTGRES_DB: gamma_test
      POSTGRES_USER: gamma_test
      POSTGRES_PASSWORD: gamma_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamma_test -d gamma_test']
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:5.0.14-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  website-db:
    image: postgres:16.0-alpine
    environment:
      POSTGRES_DB: website_test
      POSTGRES_USER: website_test
      POSTGRES_PASSWORD: website_test
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U website_test -d website_test']
      interval: 2s
      timeout: 5s
      retries: 30
